<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="lightBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="transparent" />

  <!-- Hexagon Base -->
  <path d="M256 48 L448 160 L448 352 L256 464 L64 352 L64 160 Z" fill="url(#blueGradient)" filter="url(#shadow)" />

  <!-- Inner Hexagon -->
  <path d="M256 96 L392 176 L392 336 L256 416 L120 336 L120 176 Z" fill="#ffffff" />

  <!-- Abstract 'P' and 'I' combined -->
  <g transform="translate(156, 156)">
    <!-- Vertical Stem -->
    <rect x="20" y="20" width="40" height="160" rx="8" fill="url(#blueGradient)" />
    
    <!-- P Loop -->
    <path d="M60 20 H120 C153.1 20 180 46.9 180 80 C180 113.1 153.1 140 120 140 H60 V20 Z" fill="url(#lightBlueGradient)" />
    
    <!-- Inner P Loop cutout -->
    <path d="M60 60 H110 C121 60 130 69 130 80 C130 91 121 100 110 100 H60 V60 Z" fill="#ffffff" />
    
    <!-- I Dot / Action Point -->
    <circle cx="150" cy="150" r="24" fill="#f59e0b" />
    
    <!-- Connection Line -->
    <path d="M100 150 L126 150" stroke="url(#blueGradient)" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
