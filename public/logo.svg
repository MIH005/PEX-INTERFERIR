<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>
  <g transform="translate(0, -2)">
    <!-- White border with shadow -->
    <polygon points="50,5 58.9,32.7 88,32.6 64.4,49.7 73.5,77.4 50,60.2 26.5,77.4 35.6,49.7 12,32.6 41.1,32.7" 
             fill="white" stroke="white" stroke-width="12" stroke-linejoin="round" filter="url(#shadow)" />
    
    <!-- Colored segments -->
    <!-- Yellow -->
    <polygon points="50,45 41.1,32.7 50,5 58.9,32.7" fill="#FCE044" stroke="#FCE044" stroke-width="2" stroke-linejoin="round" />
    <!-- Orange -->
    <polygon points="50,45 58.9,32.7 88,32.6 64.4,49.7" fill="#E88E3E" stroke="#E88E3E" stroke-width="2" stroke-linejoin="round" />
    <!-- Purple -->
    <polygon points="50,45 64.4,49.7 73.5,77.4 50,60.2" fill="#664C9A" stroke="#664C9A" stroke-width="2" stroke-linejoin="round" />
    <!-- Blue -->
    <polygon points="50,45 50,60.2 26.5,77.4 35.6,49.7 12,32.6 41.1,32.7" fill="#0082B4" stroke="#0082B4" stroke-width="2" stroke-linejoin="round" />
  </g>
  <text x="50" y="100" font-family="sans-serif" font-size="26" font-weight="300" text-anchor="middle" fill="#222">PEX</text>
  <text x="50" y="112" font-family="sans-serif" font-size="8" font-weight="300" text-anchor="middle" fill="#555">Programa de Excelência</text>
</svg>
